[package]
name = "movie-search-backend"
version = "0.1.0"
edition = "2021"
description = "Hybrid search engine (BM25 + embeddings) over IMDB movie metadata"

[lib]
name = "movie_search_backend"
path = "src/lib.rs"

[[bin]]
name = "movie-search-backend"
path = "src/main.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[dependencies]
actix-web = "4"
actix-cors = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"
tantivy = "0.22"
fastembed = "5"
bincode = "1.3"
rayon = "1.10"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
